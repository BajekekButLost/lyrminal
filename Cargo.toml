[package]
name = "lyrminal"
version = "1.2.22"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
cosmic-text = "0.19.0"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
flate2 = "1.1.11"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
quick-xml = "0.42.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
zbus = { version = "6.4.0", default-features = false, features = ["tokio", "proxy"] }
